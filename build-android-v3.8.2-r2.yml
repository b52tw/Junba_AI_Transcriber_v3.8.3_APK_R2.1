name: Build Junba Android APK v3.8.2 R2.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-v3.8.2-r2.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-v3.8.2-r2.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: junba-v382-apk-r21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk-r21:
    name: Compile + Build + Inspect APK R2.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for p in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/android-cli && mkdir -p /tmp/android-cli
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
            mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: R2.1 source preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          test -f android/app/src/main/java/tw/junba/transcriber/LocalWhisperEngine.kt
          test -f android/app/src/main/java/tw/junba/transcriber/AudioPreprocessor.kt
          test -f android/app/src/main/java/tw/junba/transcriber/SecureKeyStore.java
          grep -q 'versionCode = 385' android/app/build.gradle.kts
          grep -q '3.8.2-apk-r2.1' android/app/build.gradle.kts
          grep -q 'APK R2.1' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'whisper-android:1.0.0' android/app/build.gradle.kts
          if grep -q 'ffmpeg-kit-audio' android/app/build.gradle.kts; then
            echo 'ERROR: ffmpeg-kit-audio must not be packaged alongside whisper-android'
            exit 1
          fi
          if grep -q 'Robolectric' android/app/build.gradle.kts; then
            echo 'ERROR: R2.1 intentionally removes the CI-only Robolectric blocker'
            exit 1
          fi
          if grep -q 'attachBaseContext' android/app/src/main/java/tw/junba/transcriber/MainActivity.java; then
            echo 'ERROR: startup fontScale override must remain removed in R2.1'
            exit 1
          fi
          grep -q 'MediaCodec' android/app/src/main/java/tw/junba/transcriber/AudioPreprocessor.kt
          grep -q 'gemini-3.8-flash' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'File.createTempFile("jba_"' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q '儲存本次（原音檔＋TXT＋Markdown）' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          grep -q 'Gemini API Key｜已記憶' android/app/src/main/java/tw/junba/transcriber/MainActivity.java

      - name: Compile Android Java and Kotlin
        shell: bash
        run: gradle -p android :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --stacktrace --refresh-dependencies

      - name: Build APK
        shell: bash
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect APK package and launcher
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/' /tmp/apk-files.txt
          COUNT=$(grep -c 'lib/arm64-v8a/libc++_shared.so' /tmp/apk-files.txt || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "Duplicate libc++_shared.so detected: $COUNT"
            exit 1
          fi
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          DEXDUMP="$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='tw.junba.transcriber'" /tmp/badging.txt
          grep -q "launchable-activity: name='tw.junba.transcriber.MainActivity'" /tmp/badging.txt
          "$APKSIGNER" verify --verbose "$APK"
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          "$DEXDUMP" /tmp/classes.dex > /tmp/dexdump.txt
          grep -q 'tw/junba/transcriber/MainActivity' /tmp/dexdump.txt

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p r
          cp android/app/build/outputs/apk/debug/app-debug.apk 'r/Junba-R2.1.apk'
          sha256sum 'r/Junba-R2.1.apk' > r/SHA256.txt
          cat > r/BUILD_CHECKS.txt <<'TXT'
          R2.1 checks performed by GitHub Actions:
          - Java/Kotlin compilation
          - APK assembly
          - arm64 native library inspection
          - duplicate libc++_shared.so guard
          - APK signature verification
          - launchable MainActivity manifest check
          - MainActivity class present in classes.dex

          Note: the previous R2 workflow stopped at its Robolectric test harness before APK assembly.
          R2.1 removes that CI-only false blocker and also removes the startup fontScale attachBaseContext override.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: Junba-v382-APK-R2.1
          path: |
            r/Junba-R2.1.apk
            r/SHA256.txt
            r/BUILD_CHECKS.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: r/Junba-R2.1.apk
